<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>K8s Auto-Healing Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Global Styles -->
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc, #eef2f7);
      font-family: "Segoe UI", sans-serif;
    }

    .navbar {
      background: #1f2933;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.2rem;
    }

    .card {
      border-radius: 14px;
      background: #ffffff;
      border-left: 6px solid;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 35px rgba(0,0,0,0.12);
    }

    .status-green { color: #16a34a; }
    .status-red { color: #dc2626; }
    .status-yellow { color: #ca8a04; }

    .dashboard-title {
      font-weight: 700;
      margin-bottom: 30px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
  <span class="navbar-brand">⚙️ K8s Auto-Healing Portal</span>

  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="text-light me-3">👤 admin</span>
    <a href="/grafana" class="btn btn-primary btn-sm">Grafana</a>
    <a href="/prometheus" class="btn btn-success btn-sm">Prometheus</a>
    <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
  </div>
</nav>

<div class="container py-5">
  {% block content %}{% endblock %}
</div>

</body>
</html>
